name: GrooveCore
options:
  bundleIdPrefix: com.maelrochard
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
packages:
  GrooveKit:
    path: GrooveKit
settings:
  base:
    DEVELOPMENT_TEAM: 85228RBZF6
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  GrooveCore:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GrooveKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GrooveCore
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.maelrochard.groovecore.reschedule]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maelrochard.groovecore
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  GrooveCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: GrooveCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrooveCore:
    build:
      targets:
        GrooveCore: all
    test:
      targets:
        - GrooveCoreTests
